name: Deploy Dev (Web + Worker)

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "whatsapp/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION_DEV: ${{ vars.AWS_REGION_DEV }}
      WEB_BUCKET_DEV: ${{ vars.WEB_BUCKET_DEV }}
      WEB_CLOUDFRONT_DISTRIBUTION_ID_DEV: ${{ vars.WEB_CLOUDFRONT_DISTRIBUTION_ID_DEV }}
      WEB_CLOUDFRONT_DOMAIN_DEV: ${{ vars.WEB_CLOUDFRONT_DOMAIN_DEV }}
      NEXT_PUBLIC_API_URL_DEV: ${{ vars.NEXT_PUBLIC_API_URL_DEV }}
      WORKER_ASG_NAME_DEV: ${{ vars.WORKER_ASG_NAME_DEV }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub variables
        run: |
          missing=0
          for name in AWS_REGION_DEV WEB_BUCKET_DEV WEB_CLOUDFRONT_DISTRIBUTION_ID_DEV NEXT_PUBLIC_API_URL_DEV WORKER_ASG_NAME_DEV; do
            value="$(echo "${!name:-}" | tr -d '[:space:]')"
            value_lc="$(echo "$value" | tr '[:upper:]' '[:lower:]')"
            if [ -z "$value" ]; then
              echo "::error::Missing required repository variable: $name"
              missing=1
              continue
            fi
            if [ "$value_lc" = "null" ] || [ "$value_lc" = "none" ] || [ "$value_lc" = "undefined" ]; then
              echo "::error::Invalid repository variable $name: value cannot be '$value'"
              missing=1
            fi
          done
          if [ -z "${{ secrets.AWS_ROLE_ARN_DEV }}" ]; then
            echo "::error::Missing required repository secret: AWS_ROLE_ARN_DEV"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Set required vars/secrets in GitHub repo settings and rerun."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION_DEV }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build static web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL_DEV }}
        run: |
          npm run build
          test -d out
        working-directory: web

      - name: Sync web static files to S3
        run: aws s3 sync web/out "s3://${WEB_BUCKET_DEV}" --delete

      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${WEB_CLOUDFRONT_DISTRIBUTION_ID_DEV}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
          echo "Started CloudFront invalidation: $INVALIDATION_ID"

      - name: Trigger worker ASG instance refresh
        id: refresh
        run: |
          ASG_NAME="$(echo "${WORKER_ASG_NAME_DEV}" | xargs)"
          ASG_NAME_LC="$(echo "$ASG_NAME" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME_LC" = "null" ] || [ "$ASG_NAME_LC" = "none" ] || [ "$ASG_NAME_LC" = "undefined" ]; then
            echo "::error::WORKER_ASG_NAME_DEV is not set to a valid ASG name."
            exit 1
          fi
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
          echo "asg_name=$ASG_NAME" >> "$GITHUB_OUTPUT"
          echo "Started worker refresh: $REFRESH_ID"

      - name: Wait for worker refresh to complete
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          ASG_NAME="${{ steps.refresh.outputs.asg_name }}"

          for i in {1..60}; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Poll $i: $STATUS"

            if [ "$STATUS" = "Successful" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$ASG_NAME" \
                --instance-refresh-ids "$REFRESH_ID" \
                --output json
              exit 1
            fi

            sleep 20
          done

          echo "Timed out waiting for worker instance refresh."
          exit 1

      - name: Output deploy links
        run: |
          REGION="${AWS_REGION_DEV}"
          DIST_ID="${WEB_CLOUDFRONT_DISTRIBUTION_ID_DEV}"
          API_URL="${NEXT_PUBLIC_API_URL_DEV}"
          ASG_NAME="${{ steps.refresh.outputs.asg_name }}"
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          INVALIDATION_ID="${{ steps.invalidate.outputs.invalidation_id }}"

          if [ -n "${WEB_CLOUDFRONT_DOMAIN_DEV:-}" ]; then
            SITE_URL="https://${WEB_CLOUDFRONT_DOMAIN_DEV}"
          else
            SITE_URL="https://${DIST_ID}.cloudfront.net"
          fi

          DIST_LINK="https://${REGION}.console.aws.amazon.com/cloudfront/v4/home?region=${REGION}#/distributions/${DIST_ID}"
          ASG_LINK="https://${REGION}.console.aws.amazon.com/ec2autoscaling/home?region=${REGION}#AutoScalingGroupDetails:id=${ASG_NAME};view=details"

          echo "Web site URL: ${SITE_URL}"
          echo "API URL: ${API_URL}"
          echo "CloudFront console: ${DIST_LINK}"
          echo "Worker ASG console: ${ASG_LINK}"

          {
            echo "## Dev Deploy (Web + Worker)"
            echo "- Site URL: ${SITE_URL}"
            echo "- API URL: ${API_URL}"
            echo "- CloudFront Distribution: \`${DIST_ID}\`"
            echo "- Invalidation ID: \`${INVALIDATION_ID}\`"
            echo "- Worker ASG: \`${ASG_NAME}\`"
            echo "- Worker Refresh ID: \`${REFRESH_ID}\`"
            echo "- CloudFront Console: ${DIST_LINK}"
            echo "- Worker ASG Console: ${ASG_LINK}"
          } >> "$GITHUB_STEP_SUMMARY"
