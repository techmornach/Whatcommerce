services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatcommerce
      POSTGRES_PASSWORD: whatcommerce
      POSTGRES_DB: whatcommerce
    # Use 5433 on the host to avoid clashing with a local PostgreSQL on 5432
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatcommerce -d whatcommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
