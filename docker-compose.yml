services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change-me-in-dev}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-dev-tenant-1}
      BRIDGE_BASE_URL: http://wa-bridge:3001

  wa-bridge:
    build:
      context: ./apps/wa-bridge
    ports:
      - "3001:3001"
    environment:
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change-me-in-dev}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-dev-tenant-1}
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: 3001
      API_BASE_URL: http://api:8000
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    depends_on:
      - api
    volumes:
      - wa_auth:/app/.wwebjs_auth
      - wa_cache:/app/.wwebjs_cache

volumes:
  wa_auth:
  wa_cache:
